name: Build 11 APK clones

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of independent APK packages (1-11)
        required: true
        default: '11'
        type: string

permissions:
  contents: write

concurrency:
  group: apk-clones
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      CLONE_KEYSTORE_PASSWORD: ${{ secrets.CLONE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download source and packaging tools
        env:
          KEYSTORE_BASE64: ${{ secrets.CLONE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p work
          test -n "$KEYSTORE_BASE64"
          test -n "$CLONE_KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > work/clone.p12
          chmod 600 work/clone.p12
          gh release download apk-source-v2.742 --repo "$GITHUB_REPOSITORY" --pattern source.apk --dir work
          echo '3a50f089d842457eca29f3531aba68b97b3028de521971c5c9d7ac62331d6814  work/source.apk' | sha256sum --check
          curl --fail --location --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o work/apktool.jar
          sdkmanager 'build-tools;36.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y rar
      - name: Build, sign and verify all packages
        env:
          CLONE_COUNT: ${{ inputs.count }}
        run: |
          python3 scripts/build_clones.py --source work/source.apk --apktool work/apktool.jar --tools "$ANDROID_HOME/build-tools/36.0.0" --keystore work/clone.p12 --count "$CLONE_COUNT"
      - name: Archive and publish
        run: |
          set -euo pipefail
          (cd dist && rar a -m3 -s ../ArceusQT-Clones.rar ./*)
          rar t ArceusQT-Clones.rar
          sha256sum ArceusQT-Clones.rar > ArceusQT-Clones.rar.sha256
          tag="clones-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > work/release-notes.txt <<'EOF'
          Independent APK installations signed with one persistent certificate.
          Every APK passed package, label, signature, alignment and unchanged executable-payload checks.
          See build-report.json for checksums and package names.
          Client HWID, login, gameplay and simultaneous windows still require device testing.
          EOF
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Arceus QT APK clones' --notes-file work/release-notes.txt ArceusQT-Clones.rar ArceusQT-Clones.rar.sha256 dist/build-report.json dist/SHA256SUMS.txt dist/*.apk
          echo "### Download" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material from runner
        if: always()
        run: rm -f work/clone.p12
