name: Build Clone Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
      - 'settings.gradle'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew && ./gradlew :windows:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: clone-windows-apk
          path: windows/build/outputs/apk/debug/*.apk
